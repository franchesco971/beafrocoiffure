name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
      DATABASE_URL: postgresql://beafro:beafro_dev@localhost:5432/beafro
    # Le build prérend les pages du catalogue : il lit la base.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: beafro
          POSTGRES_PASSWORD: beafro_dev
          POSTGRES_DB: beafro
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U beafro -d beafro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test --if-present
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
