name: Auto Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Vercel Auto Deploy
        uses: Gourav2609/vercel-auto-deploy@v1.0.0
        with:
          exclude-authors: 'franchesco971'
          vercel-deploy-hook: ${{ secrets.VERCEL_DEPLOY_HOOK }}