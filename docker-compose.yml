services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysqldata:/var/lib/mysql
      # Droits de l'utilisateur applicatif sur les bases temporaires de `prisma migrate dev`.
      - ./docker/mysql/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    # 3307 côté hôte : 3306 est souvent déjà occupé par un MySQL local.
    ports: ["3307:3306"]
    healthcheck:
      # 127.0.0.1 (TCP) : le serveur temporaire d'initialisation n'écoute que sur le socket.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      retries: 20

  adminer:
    image: adminer
    ports: ["8080:8080"]
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on: [db]

  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]

  app:
    build: .
    env_file: .env
    ports: ["3000:3000"]
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    # Le client Prisma est généré par `app` : relance automatique tant qu'il n'existe pas.
    command: npm run worker
    restart: unless-stopped
    env_file: .env
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysqldata:
